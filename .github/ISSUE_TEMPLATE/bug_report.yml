name: Bug report
description: Report a reproducible problem in Pomodoro Desktop
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Pomodoro version
      description: Which Pomodoro Desktop version are you using?
      placeholder: v0.4.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Include the Windows edition and build if known.
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open...
        2. Start...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Optional. Remove sensitive information before sharing.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have removed sensitive information from attached logs or screenshots.
          required: true
