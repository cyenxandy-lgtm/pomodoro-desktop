[package]
name = "app"
version = "0.1.0"
description = "A lightweight Pomodoro desktop timer built with Tauri and React."
authors = ["Pomodoro Contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = "0.4.45"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
uuid = { version = "1.24.0", features = ["v4"] }
